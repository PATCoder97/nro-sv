name: Build and push Docker image

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Docker Compose files
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f casaos.yaml config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate game image tags and labels
        id: game-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/teamobi2026
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Generate database image tags and labels
        id: database-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/teamobi2026-db
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push game image
        uses: docker/build-push-action@v7
        with:
          context: ./SRC
          file: ./SRC/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.game-meta.outputs.tags }}
          labels: ${{ steps.game-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push database image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/database.Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.database-meta.outputs.tags }}
          labels: ${{ steps.database-meta.outputs.labels }}
          cache-from: type=gha,scope=database
          cache-to: type=gha,mode=max,scope=database
